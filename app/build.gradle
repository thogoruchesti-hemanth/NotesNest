// Apply Android application plugin
apply plugin: 'com.android.application'

// Load keystore properties for signing (release builds)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.example.NotesNest'
    compileSdk 36

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'] ?: 'key.properties')
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    defaultConfig {
        applicationId "com.hemanth.NotesNest"
        minSdk 29 // Android 10
        targetSdk 36 // Targeting Android 15

        versionCode 16
        versionName "3.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
    }

    compileOptions {
        // Upgrade to Java 17 for better performance and modern API support
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            pickFirsts += ["META-INF/*"]
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt"
            ]
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout

    implementation libs.activity

    // Core KTX for better Java/Kotlin interoperability
    implementation libs.androidx.core.ktx
    
    // Splash Screen API for Android 12+
    implementation libs.androidx.core.splashscreen

    // Room Database
    implementation libs.androidx.room.runtime
    annotationProcessor libs.androidx.room.compiler
    implementation libs.androidx.room.ktx

    implementation libs.work.runtime
    implementation(libs.google.gson)

    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.storage
    implementation libs.firebase.database
    implementation libs.firebase.analytics
    implementation libs.firebase.functions

    // Credential Manager for latest Google Sign-In
    implementation libs.androidx.credentials
    implementation libs.androidx.credentials.play.services.auth
    implementation libs.googleid

    implementation libs.play.services.auth
    implementation libs.google.api.client.android
    implementation libs.google.api.services.drive

    implementation libs.androidx.webkit
    implementation libs.androidx.viewpager2
    implementation libs.shimmer
    implementation libs.flexbox
    implementation libs.androidx.security.crypto
    implementation libs.picasso

    implementation libs.play.services.ads
    implementation libs.billingclient
    implementation libs.play.integrity

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

apply plugin: 'com.google.gms.google-services'
